# Tema de la aplicacion basado en los colores oficiales de los ODS.
# Streamlit Community Cloud lee este archivo desde la raiz del repositorio.

[theme]
base = "light"
primaryColor = "#00689D"             # ODS 16
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF4F8"
textColor = "#1F2A37"
linkColor = "#0A97D9"                # ODS 14
borderColor = "#D5E1EA"
baseRadius = "0.6rem"
font = "Montserrat:https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"

[theme.sidebar]
backgroundColor = "#19486A"          # ODS 17
secondaryBackgroundColor = "#245A80"
textColor = "#FFFFFF"
linkColor = "#FCC30B"                # ODS 7
borderColor = "#3A6C8F"
